# phantom 本番用リバースプロキシ
#
#   /                 joker（検索 UI・検索 API）
#   /fox/             fox（文書ビューア。astro を base=/fox でビルドしてある）
#   /skull/           skull（メタ情報管理 UI）
#   /navi/            navi（パイプライン管制 UI）
#   /api/contents/    mona（文書コンテンツ配信）
#
# joker はリンクが絶対パス（/search など）なのでルートに置く。
# skull / navi は UI をプレフィックス配下に出しつつ、UI が絶対パスで叩く API
# （/api/meta・/api/services・/tasks など）をパスごとに振り分ける。
# fox / joker が画像に使う /api/contents/{docId}/images/{filename} は
# mona のパス規約と同じなので、mona に直接渡す。

server {
    listen 8080;
    server_name _;

    include /etc/nginx/mime.types;
    client_max_body_size 32m;

    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml
               application/xml+rss text/javascript image/svg+xml;

    # 各 location に継承される
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- mona: 文書コンテンツ -------------------------------------------
    location /api/contents/ {
        proxy_pass http://mona:8002;
    }

    # ---- skull: メタ情報 API（UI が絶対パスで叩く）----------------------
    location ~ ^/api/(meta|links|group-links|unmatched)(/|$) {
        proxy_pass http://skull:8007;
    }

    # skull の同期タスク（taskservice の /tasks）
    location /tasks {
        proxy_pass http://skull:8007;
    }

    # ---- navi: パイプライン管制 API（UI が絶対パスで叩く）---------------
    location ~ ^/api/(services|pipeline)(/|$) {
        proxy_pass http://navi:8005;
    }

    # ---- 各サービスの UI ------------------------------------------------
    # skull / navi はプレフィックスを外して渡す（アプリ側はルート配信のまま）
    location = /skull {
        return 301 /skull/;
    }
    location /skull/ {
        proxy_pass http://skull:8007/;
    }

    location = /navi {
        return 301 /navi/;
    }
    location /navi/ {
        proxy_pass http://navi:8005/;
    }

    # fox は base=/fox でビルドしてあるのでプレフィックスごと渡す
    location = /fox {
        return 301 /fox/;
    }
    location /fox/ {
        proxy_pass http://fox:4321;
    }

    # ---- joker: ルート --------------------------------------------------
    location / {
        proxy_pass http://joker:4322;
    }
}
