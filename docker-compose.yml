services:
  crow:
    container_name: crow
    image: ghcr.io/hyperion13th144m/phantom-crow@sha256:3025cf26f931ebc74490b9e97ff1ae16e1260a0951cbf28f53b01a20934c2b9b
    environment:
      LANG: ja_JP.UTF-8
      TZ: Asia/Tokyo
      LOG_DIR_CROW: /var/log/crow
      NAVI_ORCHESTRATION_URL: ${NAVI_ORCHESTRATION_URL:-http://navi:8000/orchestration}
      NAVI_ORCHESTRATION_WEBHOOK_SECRET: ${NAVI_ORCHESTRATION_WEBHOOK_SECRET:-}
      NAVI_ORCHESTRATION_WEBHOOK_TIMEOUT_SECONDS: ${NAVI_ORCHESTRATION_WEBHOOK_TIMEOUT_SECONDS:-5}
    volumes:
      - ${SRC_DIR}:/src-dir
      - ${DATA_DIR}:/data-dir
      - ${LOG_DIR_CROW}:/var/log/crow
    networks:
      - phantom-network

  mona:
    container_name: mona
    image: ghcr.io/hyperion13th144m/phantom-mona@sha256:24d4a81e899f633075f658aecdb9b9d273bb1a304ecbeabc059b610517c2c503
    environment:
      LANG: ja_JP.UTF-8
      TZ: Asia/Tokyo
      LOG_DIR_MONA: /var/log/mona
      NAVI_ORCHESTRATION_URL: ${NAVI_ORCHESTRATION_URL:-http://navi:8000/orchestration}
      NAVI_ORCHESTRATION_WEBHOOK_SECRET: ${NAVI_ORCHESTRATION_WEBHOOK_SECRET:-}
      DATA_DIR: /data-dir
    volumes:
      - ${DATA_DIR}:/data-dir
      - ${LOG_DIR_MONA}:/var/log/mona
    networks:
      - phantom-network
   
  navi:
    container_name: navi
    image: ghcr.io/hyperion13th144m/phantom-navi@sha256:faaa9fbe06b601e696c0fc1841e4972e9e51d181ffcf19198e0ab457e8e38bd0
    environment:
      CROW_URL: http://crow:8000
      PANTHER_URL: http://panther:8000
      MONA_URL: http://mona:8000
      VIOLET_URL: http://violet:8000
      LANG: ja_JP.UTF-8
      TZ: Asia/Tokyo
      NAVI_ORCHESTRATION_WEBHOOK_SECRET: ${NAVI_ORCHESTRATION_WEBHOOK_SECRET:-}
      LOG_DIR_NAVI: /var/log/navi
    volumes:
      - ${LOG_DIR_NAVI}:/var/log/navi
    networks:
      - phantom-network

  violet:
    container_name: violet
    image: phantom-violet
    build:
      context: .
      dockerfile: services/violet/Dockerfile.embeddings
    environment:
      LANG: ja_JP.UTF-8
      TZ: Asia/Tokyo
      DATA_DIR: /data-dir
      MONA_URL: http://mona:8000
      LOG_DIR_VIOLET: /var/log/violet
      NAVI_ORCHESTRATION_URL: ${NAVI_ORCHESTRATION_URL:-http://navi:8000/orchestration}
      NAVI_ORCHESTRATION_WEBHOOK_SECRET: ${NAVI_ORCHESTRATION_WEBHOOK_SECRET:-}
    volumes:
      - ${DATA_DIR}:/data-dir
      - ${LOG_DIR_VIOLET}:/var/log/violet
    networks:
      - phantom-network


  panther:
    container_name: panther
    image: ghcr.io/hyperion13th144m/phantom-panther@sha256:a8a87f1740567cac80b3ffe67dade91f4f08eca6fb048ee75092d32e5ad27f38
    environment:
      MONA_URL: http://mona:8000
      ES_URL: http://es:9200
      ES_USER: ${ES_USER}
      ES_PASSWORD: ${ES_PASSWORD}
      ES_INDEX: ${ES_INDEX}
      ES_IMAGE_INDEX: ${ES_IMAGE_INDEX:-patent-images}
      SQLITE_PATH: /extra-dir/${SQLITE_NAME}
      LANG: ja_JP.UTF-8
      TZ: Asia/Tokyo
      LOG_DIR_PANTHER: /var/log/panther
      NAVI_ORCHESTRATION_URL: ${NAVI_ORCHESTRATION_URL:-http://navi:8000/orchestration}
      NAVI_ORCHESTRATION_WEBHOOK_SECRET: ${NAVI_ORCHESTRATION_WEBHOOK_SECRET:-}
      ES_CHUNK_SIZE: ${ES_CHUNK_SIZE:-100}
      ES_REQUEST_TIMEOUT: ${ES_REQUEST_TIMEOUT:-120}
    volumes:
      - ${DATA_DIR}:/data-dir
      - ${LOG_DIR_PANTHER}:/var/log/panther
    networks:
      - phantom-network

  fox:
    container_name: fox
    image: ghcr.io/hyperion13th144m/phantom-fox@sha256:1372b6dd34806c0e813c49a07e7e8ecbd57e42b73887766c2cad182b93328f0d
    environment:
      NODE_ENV: production
      ES_URL: http://es:9200
      ES_USER: ${ES_USER}
      ES_PASSWORD: ${ES_PASSWORD}
      ES_INDEX: ${ES_INDEX}
      LANG: ja_JP.UTF-8
      TZ: Asia/Tokyo
      LOG_DIR_FOX: /var/log/fox
      MONA_URL: http://mona:8000
    volumes:
      - ${LOG_DIR_FOX}:/var/log/fox
    networks:
      - phantom-network

  joker:
    container_name: joker
    image: ghcr.io/hyperion13th144m/phantom-joker@sha256:649b658b492399d8acf2fac0166db87a096f444508c243fba270462bf72dca0e
    environment:
      LANG: ja_JP.UTF-8
      TZ: Asia/Tokyo
      ES_URL: http://es:9200
      ES_USER: ${ES_USER}
      ES_PASSWORD: ${ES_PASSWORD}
      ES_INDEX: ${ES_INDEX}
      ES_IMAGE_INDEX: ${ES_IMAGE_INDEX:-patent-images}
      NEXT_PUBLIC_DOCUMENT_BASE_URL: /fox/docs
      MONA_URL: http://mona:8000
    volumes:
      - ${LOG_DIR_JOKER}:/var/log/joker
    depends_on:
      - es
    networks:
      - phantom-network

  skull:
    container_name: skull
    image: ghcr.io/hyperion13th144m/phantom-skull@sha256:fe3eef19e807ce1f740acb651f3c99f5d64a60545ba402f53df844d5fcd81ce5
    environment:
      LANG: ja_JP.UTF-8
      TZ: Asia/Tokyo
      ES_URL: http://es:9200
      ES_USER: ${ES_USER}
      ES_PASSWORD: ${ES_PASSWORD}
      ES_INDEX: ${ES_INDEX}
      NEXT_PUBLIC_DOCUMENT_BASE_URL: /fox/docs
      NEXT_PUBLIC_APP_URL: http://skull:3000/skull
      SQLITE_PATH: /extra-dir/${SQLITE_NAME}
    volumes:
      - ${LOG_DIR_SKULL}:/var/log/skull
      - ${EXTRA_DATA_DIR}:/extra-dir
    networks:
      - phantom-network

  es:
    image: phantom-elasticsearch
    container_name: phantom-elasticsearch
    build:
      context: ./infra/es
      dockerfile: Dockerfile
    environment:
      discovery.type: single-node
      xpack.security.enabled: false
      network.host: 0.0.0.0
      ELASTIC_PASSWORD: ${ES_PASSWORD}
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:- -Xms512m -Xmx512m}
    mem_limit: ${MEM_LIMIT}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s >/dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - phantom-network

  nginx:
    container_name: phantom-nginx
    image: nginx:1.29.6-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./infra/nginx/index.html:/usr/share/nginx/html/index.html
    ports:
      - ${NGINX_PORT}:8080
    depends_on:
      - joker
      - fox
      - navi
      - skull
      - mona
    networks:
      - phantom-network

  es-init:
    image: curlimages/curl:8.7.1
    container_name: phantom-es-init
    depends_on:
      es:
        condition: service_healthy
    volumes:
      - ./infra/es/generated:/mappings:ro
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        set -eu

        ES_URL="http://es:9200"
        DOC_INDEX_NAME="${ES_INDEX:-patent-documents}"
        DOC_MAPPING_FILE="/mappings/doc-mapping.json"
        IMAGE_INDEX_NAME="${ES_IMAGE_INDEX:-patent-images}"
        IMAGE_MAPPING_FILE="/mappings/img-mapping.json"

        echo "Waiting for Elasticsearch..."
        until curl -fsS "$$ES_URL/_cluster/health?wait_for_status=yellow&timeout=1s" >/dev/null; do
          sleep 2
        done

        create_index() {
          INDEX_NAME="$$1"
          MAPPING_FILE="$$2"

          if curl -fsS "$$ES_URL/$$INDEX_NAME" >/dev/null 2>&1; then
            echo "Index already exists: $$INDEX_NAME"
            return 0
          fi

          echo "Creating index: $$INDEX_NAME"
          curl -fsS -X PUT "$$ES_URL/$$INDEX_NAME" \
            -H "Content-Type: application/json" \
            --data-binary "@$$MAPPING_FILE"

          echo "Index created: $$INDEX_NAME"
        }

        create_index "$$DOC_INDEX_NAME" "$$DOC_MAPPING_FILE"
        create_index "$$IMAGE_INDEX_NAME" "$$IMAGE_MAPPING_FILE"
    networks:
      - phantom-network
  

volumes:
  es-data:

networks:
  phantom-network:
    name: phantom-network
    driver: bridge
