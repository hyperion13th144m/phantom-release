# phantom 本番環境用 docker-compose
#
#   docker compose --env-file .env.docker pull
#   docker compose --env-file .env.docker up -d
#
# 各サービスのイメージは GitHub Actions で ghcr.io に push されたものを使う。
# ホスト側の設定（データディレクトリ・公開ポート・ES 認証）は .env.docker で与える。
# リポジトリ直下の .env は開発用（$HOME を含むパスなど）なので compose には使わない。

# 各サービスに mem_limit と memswap_limit を同じ値で入れてある。
# memswap_limit を揃えるとそのコンテナはスワップを使わなくなるので、
# 上限を超えたらスワップに逃げずに即 OOM kill される。
# メモリの小さいホストで、1サービスがスワップを食い潰してホスト全体が
# 反応しなくなるのを防ぐため（restart: unless-stopped で自動的に戻る）。
# 既定値は実測値 + 余裕。ホストに合わせて .env.docker の *_MEM_LIMIT で調整する。
# 基準にするのは常駐量ではなくモデルのロード時ピーク。open_clip の checkpoint は
# safetensors が無く 1.4GB の .bin を torch.load するので、空のモデル本体と
# checkpoint の重みが一瞬だけ二重に乗り、常駐 2.7GB に対してピークは 4.0GB になる。

services:
  # ---- パイプライン（crow → queen → noir → violet → panther、HTML入力は cendrillon）--
  crow:
    container_name: crow
    image: ghcr.io/hyperion13th144m/phantom-crow@sha256:4b97feb836926aff2d7f4b1dcabf4bd1e2f09ec1777283217405155684e0b540
    restart: unless-stopped
    environment:
      LANG: ja_JP.UTF-8
      TZ: ${PHANTOM_TZ:-Asia/Tokyo}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SRC_DIR: /src-dir
      DST_DIR: /data-dir
      CROW_STATE_DIR: /var/lib/crow/tasks
      CROW_HOST: 0.0.0.0
      CROW_PORT: 8000
      # 取り込む書類の対象表（infra/whitelist/README.md）。イメージ同梱。
      # 対象外の書類コードは展開せずスキップする
      WHITE_LIST_PATH: /infra/whitelist/white-list.json
    mem_limit: ${CROW_MEM_LIMIT:-512m}
    memswap_limit: ${CROW_MEM_LIMIT:-512m}
    volumes:
      - ${PHANTOM_SRC_DIR}:/src-dir:ro
      - ${PHANTOM_DATA_DIR}:/data-dir
      - crow-state:/var/lib/crow
    networks:
      - phantom-network

  queen:
    container_name: queen
    image: ghcr.io/hyperion13th144m/phantom-queen@sha256:bd054a979a287b0870cdbc37b592f238b1526011efa66cca411e8fd409e004e8
    restart: unless-stopped
    environment:
      LANG: ja_JP.UTF-8
      TZ: ${PHANTOM_TZ:-Asia/Tokyo}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DST_DIR: /data-dir
      QUEEN_STATE_DIR: /var/lib/queen/tasks
      # XSL はイメージに同梱済み（services/queen/Dockerfile）
      XSL_DIR: /libs/jpo-schema/stylesheets/2.0
      QUEEN_HOST: 0.0.0.0
      QUEEN_PORT: 8001
    mem_limit: ${QUEEN_MEM_LIMIT:-1g}
    memswap_limit: ${QUEEN_MEM_LIMIT:-1g}
    volumes:
      - ${PHANTOM_DATA_DIR}:/data-dir
      - queen-state:/var/lib/queen
    networks:
      - phantom-network

  noir:
    container_name: noir
    image: ghcr.io/hyperion13th144m/phantom-noir@sha256:0ac0cb806c3bf556c446425f59446b8f5b244071bf370a60d5c8bfcdc6d0e5ed
    restart: unless-stopped
    environment:
      LANG: ja_JP.UTF-8
      TZ: ${PHANTOM_TZ:-Asia/Tokyo}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DST_DIR: /data-dir
      NOIR_STATE_DIR: /var/lib/noir/tasks
      NOIR_HOST: 0.0.0.0
      NOIR_PORT: 8004
      NOIR_EMBEDDING_PROVIDER: ${NOIR_EMBEDDING_PROVIDER:-sentence-transformers}
      NOIR_EMBEDDING_MODEL: ${NOIR_EMBEDDING_MODEL:-cl-nagoya/ruri-v3-130m}
      NOIR_EMBEDDING_DEVICE: ${NOIR_EMBEDDING_DEVICE:-cpu}
      # モデルの重みは HF キャッシュに残して再起動時の再ダウンロードを避ける
      HF_HOME: /var/cache/huggingface
    mem_limit: ${NOIR_MEM_LIMIT:-2g}
    memswap_limit: ${NOIR_MEM_LIMIT:-2g}
    volumes:
      - ${PHANTOM_DATA_DIR}:/data-dir
      - noir-state:/var/lib/noir
      - hf-cache:/var/cache/huggingface
    networks:
      - phantom-network

  violet:
    container_name: violet
    image: ghcr.io/hyperion13th144m/phantom-violet@sha256:7ea629974568bdae06d54346a7a1b4b1ce49ed832c14650684d28a83e032ad21
    restart: unless-stopped
    environment:
      LANG: ja_JP.UTF-8
      TZ: ${PHANTOM_TZ:-Asia/Tokyo}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DST_DIR: /data-dir
      VIOLET_STATE_DIR: /var/lib/violet/tasks
      VIOLET_HOST: 0.0.0.0
      VIOLET_PORT: 8003
      OCR_LANG: ${OCR_LANG:-jpn+eng}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      HF_HOME: /var/cache/huggingface
    mem_limit: ${VIOLET_MEM_LIMIT:-6g}
    memswap_limit: ${VIOLET_MEM_LIMIT:-6g}
    volumes:
      - ${PHANTOM_DATA_DIR}:/data-dir
      - violet-state:/var/lib/violet
      - hf-cache:/var/cache/huggingface
    networks:
      - phantom-network

  # XML が無く HTML + 画像しか残っていない文書の取り込み。
  # PHANTOM_HTML_SRC_DIR が未設定なら SRC_DIR を見る（何も見つからず空振りするだけ）
  #
  # エンベディングと OCR は自前で計算せず noir / violet の API に投げる。
  # 同じモデルを2つのコンテナに常駐させずに済むので、ここは Pillow しか積んでいない。
  # 画像は本体を送らず在り処だけを送るので、violet と同じ /data-dir が要る
  cendrillon:
    container_name: cendrillon
    image: ghcr.io/hyperion13th144m/phantom-cendrillon@sha256:d55d970369a2e7c240a4df111af481c88f862d9bd76b682fa2150c56592c36fe
    restart: unless-stopped
    environment:
      LANG: ja_JP.UTF-8
      TZ: ${PHANTOM_TZ:-Asia/Tokyo}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CENDRILLON_SRC_DIR: /html-src-dir
      DST_DIR: /data-dir
      CENDRILLON_STATE_DIR: /var/lib/cendrillon/tasks
      CENDRILLON_HOST: 0.0.0.0
      CENDRILLON_PORT: 8008
      # テキストエンベディングは noir、画像エンベディングと OCR は violet
      NOIR_URL: http://noir:8004
      VIOLET_URL: http://violet:8003
      # crow と同じ対象表。HTML には書類コードが無いので書類名で照合する
      WHITE_LIST_PATH: /infra/whitelist/white-list.json
    mem_limit: ${CENDRILLON_MEM_LIMIT:-512m}
    memswap_limit: ${CENDRILLON_MEM_LIMIT:-512m}
    volumes:
      - ${PHANTOM_HTML_SRC_DIR:-${PHANTOM_SRC_DIR}}:/html-src-dir:ro
      - ${PHANTOM_DATA_DIR}:/data-dir
      - cendrillon-state:/var/lib/cendrillon
    depends_on:
      - noir
      - violet
    networks:
      - phantom-network

  panther:
    container_name: panther
    image: ghcr.io/hyperion13th144m/phantom-panther@sha256:47e96fc708ca4123bcdcf960707650cadb9910a29f95fca4b3512efa30f24fba
    restart: unless-stopped
    environment:
      LANG: ja_JP.UTF-8
      TZ: ${PHANTOM_TZ:-Asia/Tokyo}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DST_DIR: /data-dir
      PANTHER_STATE_DIR: /var/lib/panther/tasks
      PANTHER_HOST: 0.0.0.0
      PANTHER_PORT: 8006
      ES_URL: http://es:9200
      ES_USER: ${ES_USER:-elastic}
      ES_PASSWORD: ${ES_PASSWORD:-}
      ES_API_KEY: ${ES_API_KEY:-}
      ES_DOC_INDEX: ${ES_DOC_INDEX:-documents}
      ES_IMG_INDEX: ${ES_IMG_INDEX:-images}
      # インデックス未作成時に panther がこのマッピングで作る
      ES_MAPPING_DIR: /infra/es
    mem_limit: ${PANTHER_MEM_LIMIT:-512m}
    memswap_limit: ${PANTHER_MEM_LIMIT:-512m}
    volumes:
      - ${PHANTOM_DATA_DIR}:/data-dir
      - ./infra/es:/infra/es:ro
      - panther-state:/var/lib/panther
    depends_on:
      es:
        condition: service_healthy
    networks:
      - phantom-network

  # ---- 文書配信・UI ------------------------------------------------------
  mona:
    container_name: mona
    image: ghcr.io/hyperion13th144m/phantom-mona@sha256:230c0457c58283036cbcf3568e854fe9948d64c5c17214fd4d67eabbf51fd0e2
    restart: unless-stopped
    environment:
      LANG: ja_JP.UTF-8
      TZ: ${PHANTOM_TZ:-Asia/Tokyo}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DST_DIR: /data-dir
      MONA_HOST: 0.0.0.0
      MONA_PORT: 8002
    mem_limit: ${MONA_MEM_LIMIT:-256m}
    memswap_limit: ${MONA_MEM_LIMIT:-256m}
    volumes:
      - ${PHANTOM_DATA_DIR}:/data-dir:ro
    networks:
      - phantom-network

  fox:
    container_name: fox
    image: ghcr.io/hyperion13th144m/phantom-fox@sha256:2697a63beb727338a0ea6c6cdff07ac5d23a61092e8bf69196dc7802f4cde200
    restart: unless-stopped
    environment:
      LANG: ja_JP.UTF-8
      TZ: ${PHANTOM_TZ:-Asia/Tokyo}
      NODE_ENV: production
      FOX_HOST: 0.0.0.0
      FOX_PORT: 4321
      MONA_URL: http://mona:8002
      FOX_CONFIG_PATH: /var/config/fox.config
      LOG_DIR_FOX: /var/log/fox
    mem_limit: ${FOX_MEM_LIMIT:-512m}
    memswap_limit: ${FOX_MEM_LIMIT:-512m}
    volumes:
      - fox-config:/var/config
      - fox-log:/var/log/fox
    depends_on:
      - mona
    networks:
      - phantom-network

  joker:
    container_name: joker
    image: ghcr.io/hyperion13th144m/phantom-joker@sha256:7e96c5f04c299d48c1f652d40a531777157533249edf97edde2a8dd2c02ddde5
    restart: unless-stopped
    environment:
      LANG: ja_JP.UTF-8
      TZ: ${PHANTOM_TZ:-Asia/Tokyo}
      NODE_ENV: production
      JOKER_HOST: 0.0.0.0
      JOKER_PORT: 4322
      ES_URL: http://es:9200
      ES_USER: ${ES_USER:-elastic}
      ES_PASSWORD: ${ES_PASSWORD:-}
      ES_API_KEY: ${ES_API_KEY:-}
      ES_DOC_INDEX: ${ES_DOC_INDEX:-documents}
      ES_IMG_INDEX: ${ES_IMG_INDEX:-images}
      MONA_URL: http://mona:8002
      NOIR_URL: http://noir:8004
      # 画像のセマンティック検索でフレーズを CLIP ベクトルに変換する
      VIOLET_URL: http://violet:8003
      # 検索結果から文書ページへ張るリンク。ブラウザから見える URL を指定する
      FOX_URL: ${PHANTOM_PUBLIC_URL:-http://localhost:8080}/fox
      # 管理画面（navi）へのリンクは既定の相対パス /navi でよい。
      # nginx が同じオリジンの /navi/ を navi に回している
      LOG_DIR_JOKER: /var/log/joker
    mem_limit: ${JOKER_MEM_LIMIT:-512m}
    memswap_limit: ${JOKER_MEM_LIMIT:-512m}
    volumes:
      - joker-log:/var/log/joker
    depends_on:
      es:
        condition: service_healthy
    networks:
      - phantom-network

  skull:
    container_name: skull
    image: ghcr.io/hyperion13th144m/phantom-skull@sha256:627cc66cd8bdf2e6a46f9995b464e2d5f3198f5013abae1a8bfa62613f5a6d99
    restart: unless-stopped
    environment:
      LANG: ja_JP.UTF-8
      TZ: ${PHANTOM_TZ:-Asia/Tokyo}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SKULL_HOST: 0.0.0.0
      SKULL_PORT: 8007
      SKULL_DB_URL: sqlite:////var/lib/skull/skull.db
      SKULL_STATE_DIR: /var/lib/skull/tasks
      ES_URL: http://es:9200
      ES_USER: ${ES_USER:-elastic}
      ES_PASSWORD: ${ES_PASSWORD:-}
      ES_API_KEY: ${ES_API_KEY:-}
      ES_DOC_INDEX: ${ES_DOC_INDEX:-documents}
      ES_IMG_INDEX: ${ES_IMG_INDEX:-images}
    mem_limit: ${SKULL_MEM_LIMIT:-512m}
    memswap_limit: ${SKULL_MEM_LIMIT:-512m}
    volumes:
      - skull-data:/var/lib/skull
    depends_on:
      es:
        condition: service_healthy
    networks:
      - phantom-network

  # ---- パイプライン管制 --------------------------------------------------
  navi:
    container_name: navi
    image: ghcr.io/hyperion13th144m/phantom-navi@sha256:f532c46528ac0f0a7cd8c2ff07067cfabe89099951ae05236cecb1c2607f7362
    restart: unless-stopped
    environment:
      LANG: ja_JP.UTF-8
      TZ: ${PHANTOM_TZ:-Asia/Tokyo}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NAVI_HOST: 0.0.0.0
      NAVI_PORT: 8005
      NAVI_POLL_INTERVAL: ${NAVI_POLL_INTERVAL:-2.0}
      CROW_URL: http://crow:8000
      QUEEN_URL: http://queen:8001
      NOIR_URL: http://noir:8004
      VIOLET_URL: http://violet:8003
      CENDRILLON_URL: http://cendrillon:8008
      PANTHER_URL: http://panther:8006
      MONA_URL: http://mona:8002
      # fox は base=/fox でビルドしてあるので /health も /fox 配下
      FOX_URL: http://fox:4321/fox
      JOKER_URL: http://joker:4322
      SKULL_URL: http://skull:8007
    mem_limit: ${NAVI_MEM_LIMIT:-256m}
    memswap_limit: ${NAVI_MEM_LIMIT:-256m}
    depends_on:
      - crow
      - queen
      - noir
      - violet
      - panther
    networks:
      - phantom-network

  # ---- リバースプロキシ --------------------------------------------------
  # ホストに出るのはこのポートだけ。ルーティングは infra/nginx/nginx.conf 参照
  nginx:
    container_name: phantom-nginx
    image: nginx:1.29-alpine
    restart: unless-stopped
    environment:
      TZ: ${PHANTOM_TZ:-Asia/Tokyo}
    ports:
      - ${PHANTOM_HTTP_PORT:-8080}:8080
    mem_limit: ${NGINX_MEM_LIMIT:-128m}
    memswap_limit: ${NGINX_MEM_LIMIT:-128m}
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - joker
      - fox
      - skull
      - navi
      - mona
    networks:
      - phantom-network

  # ---- Elasticsearch -----------------------------------------------------
  # マッピングが analysis-kuromoji / analysis-icu を使うのでプラグイン入りの
  # イメージを infra/es の Dockerfile からビルドする
  es:
    container_name: phantom-elasticsearch
    image: phantom-elasticsearch
    build:
      context: ./infra/es
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: false
      network.host: 0.0.0.0
      ELASTIC_PASSWORD: ${ES_PASSWORD:-}
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:- -Xms2g -Xmx2g}
    mem_limit: ${ES_MEM_LIMIT:-4g}
    memswap_limit: ${ES_MEM_LIMIT:-4g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s >/dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - phantom-network

volumes:
  es-data:
  crow-state:
  queen-state:
  noir-state:
  violet-state:
  cendrillon-state:
  panther-state:
  skull-data:
  fox-config:
  fox-log:
  joker-log:
  hf-cache:

networks:
  phantom-network:
    name: phantom-network
    driver: bridge
