# phantom 本番環境用 docker-compose
#
#   docker compose --env-file .env.docker pull
#   docker compose --env-file .env.docker up -d
#
# 各サービスのイメージは GitHub Actions で ghcr.io に push されたものを使う。
# ホスト側の設定（データディレクトリ・公開ポート・ES 認証）は .env.docker で与える。
# リポジトリ直下の .env は開発用（$HOME を含むパスなど）なので compose には使わない。

# 各サービスに mem_limit と memswap_limit を同じ値で入れてある。
# memswap_limit を揃えるとそのコンテナはスワップを使わなくなるので、
# 上限を超えたらスワップに逃げずに即 OOM kill される。
# メモリの小さいホストで、1サービスがスワップを食い潰してホスト全体が
# 反応しなくなるのを防ぐため（restart: unless-stopped で自動的に戻る）。
# 既定値は実測値 + 余裕。ホストに合わせて .env.docker の *_MEM_LIMIT で調整する。
# 基準にするのは常駐量ではなくモデルのロード時ピーク。open_clip の checkpoint は
# safetensors が無く 1.4GB の .bin を torch.load するので、空のモデル本体と
# checkpoint の重みが一瞬だけ二重に乗り、常駐 2.7GB に対してピークは 4.0GB になる。

services:
  # ---- モデルサーバー ----------------------------------------------------
  # モデルサーバー。ruri（文書・クエリ）と CLIP（画像・テキスト）を常駐させ、
  # navi の取り込みと joker の検索の両方がこれを使う。
  # 画像は {docId, filename} で受け取って /data-dir から読む
  queen:
    container_name: queen
    image: ghcr.io/hyperion13th144m/phantom-queen@sha256:a0bf129347db02ec5701383c46efdf40ec24902a2c399562c56cbf4f7091345b
    restart: unless-stopped
    environment:
      LANG: ja_JP.UTF-8
      TZ: ${PHANTOM_TZ:-Asia/Tokyo}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DST_DIR: /data-dir
      QUEEN_HOST: 0.0.0.0
      QUEEN_PORT: 8001
      # 0 なら torch の既定（物理コア数）
      QUEEN_TORCH_THREADS: ${QUEEN_TORCH_THREADS:-0}
      # 起動したら裏でモデルを読み始める（最初の依頼でダウンロードを待たされないように）
      QUEEN_PRELOAD: ${QUEEN_PRELOAD:-1}
      NOIR_EMBEDDING_PROVIDER: ${NOIR_EMBEDDING_PROVIDER:-sentence-transformers}
      NOIR_EMBEDDING_MODEL: ${NOIR_EMBEDDING_MODEL:-cl-nagoya/ruri-v3-130m}
      NOIR_EMBEDDING_DEVICE: ${NOIR_EMBEDDING_DEVICE:-cpu}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      # モデルの重みは HF キャッシュに残して再起動時の再ダウンロードを避ける
      HF_HOME: /var/cache/huggingface
      # 1 にすると Hugging Face に問い合わせずにキャッシュから読む。ふだんは空でよい
      # （一度モデルを読めたら queen が自分でオフラインに切り替える。services/queen/README.md）
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-}
    # 常駐 3.5GB 程度（ruri 0.7 ＋ CLIP 2.7）、読み込み時のピーク 4.5GB 程度
    mem_limit: ${QUEEN_MEM_LIMIT:-6g}
    memswap_limit: ${QUEEN_MEM_LIMIT:-6g}
    volumes:
      - ${PHANTOM_DATA_DIR}:/data-dir:ro
      - hf-cache:/var/cache/huggingface
    networks:
      - phantom-network

  # ---- 文書配信・UI ------------------------------------------------------
  mona:
    container_name: mona
    image: ghcr.io/hyperion13th144m/phantom-mona@sha256:c9e235b4bfe816445b9de37c6de2fda22f8de311c3e515bac0e41531ac6b02d5
    restart: unless-stopped
    environment:
      LANG: ja_JP.UTF-8
      TZ: ${PHANTOM_TZ:-Asia/Tokyo}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DST_DIR: /data-dir
      MONA_HOST: 0.0.0.0
      MONA_PORT: 8002
    mem_limit: ${MONA_MEM_LIMIT:-256m}
    memswap_limit: ${MONA_MEM_LIMIT:-256m}
    volumes:
      - ${PHANTOM_DATA_DIR}:/data-dir:ro
    networks:
      - phantom-network

  fox:
    container_name: fox
    image: ghcr.io/hyperion13th144m/phantom-fox@sha256:dbc0bcd4a6e494c34a0e9fca0ef91dbc527941c32afd6f95c25fbceb64148f34
    restart: unless-stopped
    environment:
      LANG: ja_JP.UTF-8
      TZ: ${PHANTOM_TZ:-Asia/Tokyo}
      NODE_ENV: production
      FOX_HOST: 0.0.0.0
      FOX_PORT: 4321
      MONA_URL: http://mona:8002
      FOX_CONFIG_PATH: /var/config/fox.config
      LOG_DIR_FOX: /var/log/fox
    mem_limit: ${FOX_MEM_LIMIT:-512m}
    memswap_limit: ${FOX_MEM_LIMIT:-512m}
    volumes:
      - fox-config:/var/config
      - fox-log:/var/log/fox
    depends_on:
      - mona
    networks:
      - phantom-network

  joker:
    container_name: joker
    image: ghcr.io/hyperion13th144m/phantom-joker@sha256:9ce7a81eaa9481ef92215e64a8c813547f33a12458b344fe6900b58348c1fe34
    restart: unless-stopped
    environment:
      LANG: ja_JP.UTF-8
      TZ: ${PHANTOM_TZ:-Asia/Tokyo}
      NODE_ENV: production
      JOKER_HOST: 0.0.0.0
      JOKER_PORT: 4322
      ES_URL: http://es:9200
      ES_USER: ${ES_USER:-elastic}
      ES_PASSWORD: ${ES_PASSWORD:-}
      ES_API_KEY: ${ES_API_KEY:-}
      ES_DOC_INDEX: ${ES_DOC_INDEX:-documents}
      ES_IMG_INDEX: ${ES_IMG_INDEX:-images}
      MONA_URL: http://mona:8002
      # 検索フレーズを、文書（ruri）・画像（CLIP）と同じ空間のベクトルに変換する
      QUEEN_URL: http://queen:8001
      # 検索結果から文書ページへ張るリンク。ブラウザから見える URL を指定する
      FOX_URL: ${PHANTOM_PUBLIC_URL:-http://localhost:8080}/fox
      # 管理画面（navi）へのリンクは既定の相対パス /navi でよい。
      # nginx が同じオリジンの /navi/ を navi に回している
      LOG_DIR_JOKER: /var/log/joker
    mem_limit: ${JOKER_MEM_LIMIT:-512m}
    memswap_limit: ${JOKER_MEM_LIMIT:-512m}
    volumes:
      - joker-log:/var/log/joker
    depends_on:
      es:
        condition: service_healthy
    networks:
      - phantom-network

  skull:
    container_name: skull
    image: ghcr.io/hyperion13th144m/phantom-skull@sha256:8e2f82a3777023ad56db2a644a376add0e5f3bfe1209b0cc7816096d0f13d0fd
    restart: unless-stopped
    environment:
      LANG: ja_JP.UTF-8
      TZ: ${PHANTOM_TZ:-Asia/Tokyo}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SKULL_HOST: 0.0.0.0
      SKULL_PORT: 8007
      SKULL_DB_URL: sqlite:////var/lib/skull/skull.db
      SKULL_STATE_DIR: /var/lib/skull/tasks
      ES_URL: http://es:9200
      ES_USER: ${ES_USER:-elastic}
      ES_PASSWORD: ${ES_PASSWORD:-}
      ES_API_KEY: ${ES_API_KEY:-}
      ES_DOC_INDEX: ${ES_DOC_INDEX:-documents}
      ES_IMG_INDEX: ${ES_IMG_INDEX:-images}
    mem_limit: ${SKULL_MEM_LIMIT:-512m}
    memswap_limit: ${SKULL_MEM_LIMIT:-512m}
    volumes:
      - skull-data:/var/lib/skull
    depends_on:
      es:
        condition: service_healthy
    networks:
      - phantom-network

  # ---- 取り込みの管理（navi）---------------------------------------------
  navi:
    container_name: navi
    image: ghcr.io/hyperion13th144m/phantom-navi@sha256:c2aadd0ceeac1a859987071cbff8f77fc2e9530dae9ef0e59a7a0514842dd8f5
    restart: unless-stopped
    environment:
      LANG: ja_JP.UTF-8
      TZ: ${PHANTOM_TZ:-Asia/Tokyo}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NAVI_HOST: 0.0.0.0
      NAVI_PORT: 8005
      MONA_URL: http://mona:8002
      # fox は base=/fox でビルドしてあるので /health も /fox 配下
      FOX_URL: http://fox:4321/fox
      JOKER_URL: http://joker:4322
      SKULL_URL: http://skull:8007
      QUEEN_URL: http://queen:8001
      # ---- 取り込み（POST /api/runs、設計書 §2）----
      # 環境変数の名前は、取り込みが複数のサービスに分かれていたころと同じ
      SRC_DIR: /src-dir
      CENDRILLON_SRC_DIR: /html-src-dir
      DST_DIR: /data-dir
      NAVI_STATE_DIR: /var/lib/navi
      WHITE_LIST_PATH: /infra/whitelist/white-list.json
      ES_URL: http://es:9200
      ES_USER: ${ES_USER:-elastic}
      ES_PASSWORD: ${ES_PASSWORD:-}
      ES_API_KEY: ${ES_API_KEY:-}
      ES_DOC_INDEX: ${ES_DOC_INDEX:-documents}
      ES_IMG_INDEX: ${ES_IMG_INDEX:-images}
      ES_MAPPING_DIR: /infra/es
      OCR_LANG: ${OCR_LANG:-jpn+eng}
      # 並列度（設計書 §2.4）
      NAVI_DOC_CONCURRENCY: ${NAVI_DOC_CONCURRENCY:-4}
      NAVI_OCR_SLOTS: ${NAVI_OCR_SLOTS:-4}
      NAVI_IMAGE_WORKERS: ${NAVI_IMAGE_WORKERS:-4}
    # XSLT（saxonche の JVM）と画像変換のワーカーを持つ
    mem_limit: ${NAVI_MEM_LIMIT:-2g}
    memswap_limit: ${NAVI_MEM_LIMIT:-2g}
    volumes:
      - ${PHANTOM_SRC_DIR}:/src-dir:ro
      - ${PHANTOM_HTML_SRC_DIR:-${PHANTOM_SRC_DIR}}:/html-src-dir:ro
      - ${PHANTOM_DATA_DIR}:/data-dir
      - navi-state:/var/lib/navi
    depends_on:
      queen:
        condition: service_started
      # 取り込みは実行の最初に ES のインデックスを確かめる
      es:
        condition: service_healthy
    networks:
      - phantom-network

  # ---- リバースプロキシ --------------------------------------------------
  # ホストに出るのはこのポートだけ。ルーティングは infra/nginx/nginx.conf 参照
  nginx:
    container_name: phantom-nginx
    image: nginx:1.29-alpine
    restart: unless-stopped
    environment:
      TZ: ${PHANTOM_TZ:-Asia/Tokyo}
    ports:
      - ${PHANTOM_HTTP_PORT:-8080}:8080
    mem_limit: ${NGINX_MEM_LIMIT:-128m}
    memswap_limit: ${NGINX_MEM_LIMIT:-128m}
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - joker
      - fox
      - skull
      - navi
      - mona
    networks:
      - phantom-network

  # ---- Elasticsearch -----------------------------------------------------
  # マッピングが analysis-kuromoji / analysis-icu を使うので、
  # プラグインを入れたイメージを使う。
  # 以前は利用者側の compose がビルドしていたが、プラグインの取得に
  # elastic.co への到達性が要り、利用者のネットワークによっては失敗する。
  # 他のサービスと同じく ghcr.io から pull する（infra/es は CI がビルドする）
  es:
    container_name: phantom-elasticsearch
    image: ghcr.io/hyperion13th144m/phantom-elasticsearch@sha256:a0945987e7d8a02ca8cdc765b3f8a4c4315617ee730525bf5ade1050c4055df6
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: false
      network.host: 0.0.0.0
      ELASTIC_PASSWORD: ${ES_PASSWORD:-}
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:- -Xms2g -Xmx2g}
    mem_limit: ${ES_MEM_LIMIT:-4g}
    memswap_limit: ${ES_MEM_LIMIT:-4g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s >/dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - phantom-network

volumes:
  es-data:
  navi-state:
  skull-data:
  fox-config:
  fox-log:
  joker-log:
  hf-cache:

networks:
  phantom-network:
    name: phantom-network
    driver: bridge
