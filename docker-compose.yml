services:
  crow:
    container_name: crow
    image: ghcr.io/hyperion13th144m/phantom-crow@sha256:a442285cbc726d1c5dd0c32253774253304aa8e8654b00a5afbc07332f33409b
    environment:
      LANG: ja_JP.UTF-8
      TZ: Asia/Tokyo
      LOG_DIR_CROW: /var/log/crow
      NAVI_ORCHESTRATION_URL: ${NAVI_ORCHESTRATION_URL:-http://navi:8000/orchestration}
      NAVI_ORCHESTRATION_WEBHOOK_SECRET: ${NAVI_ORCHESTRATION_WEBHOOK_SECRET:-}
      NAVI_ORCHESTRATION_WEBHOOK_TIMEOUT_SECONDS: ${NAVI_ORCHESTRATION_WEBHOOK_TIMEOUT_SECONDS:-5}
    volumes:
      - ${SRC_DIR}:/src-dir
      - ${DATA_DIR}:/data-dir
      - ${LOG_DIR_CROW}:/var/log/crow
    networks:
      - phantom-network

  mona:
    container_name: mona
    image: ghcr.io/hyperion13th144m/phantom-mona@sha256:2b1f169d6bab272c25d482a71d161de47872e6d6e20c7a3fc901f2b7ab0c29d4
    environment:
      LANG: ja_JP.UTF-8
      TZ: Asia/Tokyo
      LOG_DIR_MONA: /var/log/mona
      NAVI_ORCHESTRATION_URL: ${NAVI_ORCHESTRATION_URL:-http://navi:8000/orchestration}
      NAVI_ORCHESTRATION_WEBHOOK_SECRET: ${NAVI_ORCHESTRATION_WEBHOOK_SECRET:-}
      DATA_DIR: /data-dir
    volumes:
      - ${DATA_DIR}:/data-dir
      - ${LOG_DIR_MONA}:/var/log/mona
    networks:
      - phantom-network
   
  navi:
    container_name: navi
    image: ghcr.io/hyperion13th144m/phantom-navi@sha256:2c6b88484d8af31e26d6c813861fa2ea3606af401e018e2b735b92e61dba75f0
    environment:
      CROW_URL: http://crow:8000
      PANTHER_URL: http://panther:8000
      MONA_URL: http://mona:8000
      VIOLET_URL: http://violet:8000
      LANG: ja_JP.UTF-8
      TZ: Asia/Tokyo
      NAVI_ORCHESTRATION_WEBHOOK_SECRET: ${NAVI_ORCHESTRATION_WEBHOOK_SECRET:-}
      LOG_DIR_NAVI: /var/log/navi
    volumes:
      - ${LOG_DIR_NAVI}:/var/log/navi
    networks:
      - phantom-network

  violet:
    container_name: violet
    image: phantom-violet
    build:
      context: ./services/violet
      dockerfile: Dockerfile.embeddings
    environment:
      LANG: ja_JP.UTF-8
      TZ: Asia/Tokyo
      DATA_DIR: /data-dir
      MONA_URL: http://mona:8000
      LOG_DIR_VIOLET: /var/log/violet
      NAVI_ORCHESTRATION_URL: ${NAVI_ORCHESTRATION_URL:-http://navi:8000/orchestration}
      NAVI_ORCHESTRATION_WEBHOOK_SECRET: ${NAVI_ORCHESTRATION_WEBHOOK_SECRET:-}
    volumes:
      - ${DATA_DIR}:/data-dir
      - ${LOG_DIR_VIOLET}:/var/log/violet
    networks:
      - phantom-network


  panther:
    container_name: panther
    image: ghcr.io/hyperion13th144m/phantom-panther@sha256:aa43c20b8076d2665835c40eba35b11436ed56eddc9a32960ee0abee2c63d1fe
    environment:
      MONA_URL: http://mona:8000
      ES_URL: http://es:9200
      ES_USER: ${ES_USER}
      ES_PASSWORD: ${ES_PASSWORD}
      ES_INDEX: ${ES_INDEX}
      ES_IMAGE_INDEX: ${ES_IMAGE_INDEX:-patent-images}
      SQLITE_PATH: /extra-dir/${SQLITE_NAME}
      LANG: ja_JP.UTF-8
      TZ: Asia/Tokyo
      LOG_DIR_PANTHER: /var/log/panther
      NAVI_ORCHESTRATION_URL: ${NAVI_ORCHESTRATION_URL:-http://navi:8000/orchestration}
      NAVI_ORCHESTRATION_WEBHOOK_SECRET: ${NAVI_ORCHESTRATION_WEBHOOK_SECRET:-}
      ES_CHUNK_SIZE: ${ES_CHUNK_SIZE:-100}
      ES_REQUEST_TIMEOUT: ${ES_REQUEST_TIMEOUT:-120}
    volumes:
      - ${DATA_DIR}:/data-dir
      - ${LOG_DIR_PANTHER}:/var/log/panther
    networks:
      - phantom-network

  fox:
    container_name: fox
    image: ghcr.io/hyperion13th144m/phantom-fox@sha256:bb57bef9f747094c48be06b38304babe881c92bf88b225841094bfa06054822b
    environment:
      NODE_ENV: production
      ES_URL: http://es:9200
      ES_USER: ${ES_USER}
      ES_PASSWORD: ${ES_PASSWORD}
      ES_INDEX: ${ES_INDEX}
      LANG: ja_JP.UTF-8
      TZ: Asia/Tokyo
      LOG_DIR_FOX: /var/log/fox
      MONA_URL: http://mona:8000
    volumes:
      - ${LOG_DIR_FOX}:/var/log/fox
    networks:
      - phantom-network

  joker:
    container_name: joker
    image: ghcr.io/hyperion13th144m/phantom-joker@sha256:180448803365d40a891a0f4cd846153121295d0802d554f1345e29489f20f98a
    environment:
      LANG: ja_JP.UTF-8
      TZ: Asia/Tokyo
      ES_URL: http://es:9200
      ES_USER: ${ES_USER}
      ES_PASSWORD: ${ES_PASSWORD}
      ES_INDEX: ${ES_INDEX}
      ES_IMAGE_INDEX: ${ES_IMAGE_INDEX:-patent-images}
      NEXT_PUBLIC_DOCUMENT_BASE_URL: /fox/docs
      MONA_URL: http://mona:8000
    volumes:
      - ${LOG_DIR_JOKER}:/var/log/joker
    depends_on:
      - es
    networks:
      - phantom-network

  skull:
    container_name: skull
    image: ghcr.io/hyperion13th144m/phantom-skull@sha256:7872c415ed7b4b7e0a2bbb0c253d7f423fb4035c67ff3d92d49e4c41b7aee0b0
    environment:
      LANG: ja_JP.UTF-8
      TZ: Asia/Tokyo
      ES_URL: http://es:9200
      ES_USER: ${ES_USER}
      ES_PASSWORD: ${ES_PASSWORD}
      ES_INDEX: ${ES_INDEX}
      NEXT_PUBLIC_DOCUMENT_BASE_URL: /fox/docs
      NEXT_PUBLIC_APP_URL: http://skull:3000/skull
      SQLITE_PATH: /extra-dir/${SQLITE_NAME}
    volumes:
      - ${LOG_DIR_SKULL}:/var/log/skull
      - ${EXTRA_DATA_DIR}:/extra-dir
    networks:
      - phantom-network

  es:
    image: phantom-elasticsearch
    container_name: phantom-elasticsearch
    build:
      context: ./infra/elasticsearch
      dockerfile: Dockerfile
    environment:
      discovery.type: single-node
      xpack.security.enabled: false
      network.host: 0.0.0.0
      ELASTIC_PASSWORD: ${ES_PASSWORD}
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: ${MEM_LIMIT}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s >/dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - phantom-network

  nginx:
    container_name: phantom-nginx
    image: nginx:1.29.6-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./infra/nginx/index.html:/usr/share/nginx/html/index.html
    ports:
      - ${NGINX_PORT}:8080
    depends_on:
      - joker
      - fox
      - navi
      - skull
      - mona
    networks:
      - phantom-network

  es-init:
    image: curlimages/curl:8.7.1
    container_name: phantom-es-init
    depends_on:
      es:
        condition: service_healthy
    volumes:
      - ./es:/mappings:ro
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        set -eu

        ES_URL="http://es:9200"
        DOC_INDEX_NAME="${ES_INDEX:-patent-documents}"
        DOC_MAPPING_FILE="/mappings/mapping.json"
        IMAGE_INDEX_NAME="${ES_IMAGE_INDEX:-patent-images}"
        IMAGE_MAPPING_FILE="/mappings/image-mapping.json"

        echo "Waiting for Elasticsearch..."
        until curl -fsS "$$ES_URL/_cluster/health?wait_for_status=yellow&timeout=1s" >/dev/null; do
          sleep 2
        done

        create_index() {
          INDEX_NAME="$$1"
          MAPPING_FILE="$$2"

          if curl -fsS "$$ES_URL/$$INDEX_NAME" >/dev/null 2>&1; then
            echo "Index already exists: $$INDEX_NAME"
            return 0
          fi

          echo "Creating index: $$INDEX_NAME"
          curl -fsS -X PUT "$$ES_URL/$$INDEX_NAME" \
            -H "Content-Type: application/json" \
            --data-binary "@$$MAPPING_FILE"

          echo "Index created: $$INDEX_NAME"
        }

        create_index "$$DOC_INDEX_NAME" "$$DOC_MAPPING_FILE"
        create_index "$$IMAGE_INDEX_NAME" "$$IMAGE_MAPPING_FILE"
    networks:
      - phantom-network
  

volumes:
  es-data:

networks:
  phantom-network:
    name: phantom-network
    driver: bridge
